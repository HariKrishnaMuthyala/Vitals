<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vitals Time-Series (Clean Labels)</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Annotation Plugin (vertical 7 AM lines) -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0/dist/chartjs-plugin-annotation.min.js"></script>

<!-- Data Labels Plugin (labels at each node) -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f7f7f7;
    }
    h2 {
        text-align: center;
        margin-bottom: 20px;
    }
    .chart-container {
        width: 95%;
        margin: 20px auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px #ccc;
        display: none;
    }
    select {
        display: block;
        margin: 0 auto 20px auto;
        padding: 10px;
        font-size: 18px;
    }
</style>
</head>

<body>

<h2>Vitals Time-Series Dashboard</h2>

<select id="chartSelector">
    <option value="sugarChart">Blood Sugar (GRBS)</option>
    <option value="bpChart">Blood Pressure (Systolic)</option>
    <option value="pulseChart">Pulse Rate</option>
    <option value="spo2Chart">SpO₂</option>
</select>

<script>
// ------------------------------------------------------
// DATA SECTION — Add new dates & times here
// ------------------------------------------------------

const vitals = {
    "2024-07-19": {
        times: ["7 AM", "1 PM", "3 PM", "5 PM", "8 PM"],
        sugar: [241, 259, 295, 283, 157],
        pulse: [98, 98, 82, 81, 81],
        bp_sys: [null, 117, 110, null, 127],
        spo2: [99, 99, 99, 98, 98]
    },
    "2024-07-20": {
        times: ["7 AM", "12:30 PM", "4 PM", "7 PM"],
        sugar: [138, 263, 283, 270],
        pulse: [84, null, 82, 81],
        bp_sys: [134, null, 110, 110],
        spo2: [98, null, 99, 99]
    },
	"2024-07-21": {
    "times": ["8 AM", "11 AM", "2 PM", "5 PM", "8 PM", "11 PM" ],
    "sugar": [247, 375, 255, 197, 153, 117],
    "pulse": [81, 101, 105, null, 82, null],
    "bp_sys": [130, 100, 110, null, 125, null],
    "spo2": [98, 99, 94, null, 98, null]
	},
	"2024-07-22": {
    "times": ["8 AM", "2 PM", "5 PM", "8 PM", "11 PM" ],
    "sugar": [183, 255, 335, 218, 275],
    "pulse": [84, 82, 86, 77, 86],
    "bp_sys": [130, 118, 120, 118, 120],
    "spo2": [98, 98, 98, 99, 99]
	},
	"2024-07-28": {
    "times": ["8 AM", "11 AM", "1 PM", "10 PM"],
    "sugar": [180, 250, 230, 231],
    "pulse": [82, 86, 87, 87],
    "bp_sys": [130, 100, 104, 127],
    "spo2": [99, 97, 99, 98]
	},
	"2024-07-24": {
    "times": ["8 AM", "11 AM", "2 PM", "5 PM", "8 PM", "10 PM"],
    "sugar": [218, 255, 225, 298, 299, 258],
    "pulse": [87, 86, 87, 86, 82, 89],
    "bp_sys": [130, 129, 129, 121, 120, 130],
    "spo2": [99, 98, 98, 97, 98, 98]
	},
	"2024-07-25": {
    "times": ["8 AM", "11 AM", "2 PM", "5 PM", "8 PM", "10 PM"],
    "sugar": [270, 251, 221, 231, 269, 279],
    "pulse": [84, 91, 87, 87, 76, 89],
    "bp_sys": [128, 134, 118, 128, 122, 123],
    "spo2": [99, 98, 99, 99, 99, 89]
	},
	"2024-07-26": {
    "times": ["8 AM", "11 AM", "2 PM", "5 PM", "8 PM", "10 PM"],
    "sugar": [228, 260, 235, 196, 191, 238],
    "pulse": [82, 87, 76, 82, 84, 82],
    "bp_sys": [129, 119, 117, 112, 112, 112],
    "spo2": [99, 99, 98, 99, 99, 99]
	},
	"2024-07-27": {
    "times": ["6 AM", "10 AM", "1 PM", "8 PM", "10 PM"],
    "sugar": [288, 287, 187, 258, 258],
    "pulse": [88, 86, 79, 76, 87],
    "bp_sys": [135, 129, 129, 122, 112],
    "spo2": [99, 99, 98, 98, 98]


}

};

// ------------------------------------------------------
// Convert "7 AM" → "07:00"
// ------------------------------------------------------

function convertTo24Hour(timeStr) {
    timeStr = timeStr.trim();
    if (timeStr.includes("AM") || timeStr.includes("PM")) {
        var parts = timeStr.split(" ");
        var hm = parts[0].split(":");
        var hour = parseInt(hm[0]);
        var minute = hm[1] ? hm[1] : "00";
        var ampm = parts[1];

        if (ampm === "PM" && hour !== 12) hour += 12;
        if (ampm === "AM" && hour === 12) hour = 0;

        return (hour < 10 ? "0" + hour : hour) + ":" + minute;
    }
    return timeStr;
}

// ------------------------------------------------------
// Build continuous timeline (date + hour)
// ------------------------------------------------------

const dates = Object.keys(vitals);
var allDateTimes = [];

for (var i = 0; i < dates.length; i++) {
    var date = dates[i];
    for (var hour = 0; hour < 24; hour++) {
        var label = date + " " + (hour < 10 ? "0" + hour : hour) + ":00";
        allDateTimes.push(label);
    }
}

// ------------------------------------------------------
// Build continuous dataset
// ------------------------------------------------------

function buildContinuousDataset(vitalKey) {
    var data = [];

    for (var i = 0; i < dates.length; i++) {
        var date = dates[i];
        var dayVitals = vitals[date];

        var timeMap = {};
        for (var j = 0; j < dayVitals.times.length; j++) {
            var t24 = convertTo24Hour(dayVitals.times[j]);
            timeMap[date + " " + t24] = dayVitals[vitalKey][j];
        }

        for (var hour = 0; hour < 24; hour++) {
            var t = (hour < 10 ? "0" + hour : hour) + ":00";
            var key = date + " " + t;

            data.push(timeMap[key] !== undefined ? timeMap[key] : null);
        }
    }

    return data;
}

// ------------------------------------------------------
// Build vertical 7 AM lines
// ------------------------------------------------------

function buildVerticalLines() {
    let annotations = {};

    for (let i = 0; i < dates.length; i++) {
        let date = dates[i];
        let target = date + " 07:00";

        let index = allDateTimes.indexOf(target);
        if (index !== -1) {
            annotations["line" + i] = {
                type: 'line',
                xMin: index,
                xMax: index,
                borderColor: 'black',
                borderWidth: 2,
                label: {
                    enabled: true,
                    content: date,
                    position: 'start',
                    backgroundColor: 'white'
                }
            };
        }
    }

    return annotations;
}

</script>

<!-- Chart Containers -->
<div class="chart-container" id="sugarChartContainer">
    <canvas id="sugarChart"></canvas>
</div>

<div class="chart-container" id="bpChartContainer">
    <canvas id="bpChart"></canvas>
</div>

<div class="chart-container" id="pulseChartContainer">
    <canvas id="pulseChart"></canvas>
</div>

<div class="chart-container" id="spo2ChartContainer">
    <canvas id="spo2Chart"></canvas>
</div>

<script>
// ------------------------------------------------------
// Create charts with Y-value labels + vertical lines
// ------------------------------------------------------

function createChart(canvasId, vitalKey, title, color) {
    return new Chart(document.getElementById(canvasId), {
        type: "line",
        plugins: [ChartDataLabels],
        data: {
            labels: allDateTimes,
            datasets: [{
                label: title,
                data: buildContinuousDataset(vitalKey),
                borderColor: color,
                fill: false,
                tension: 0.2,
                spanGaps: true,
                pointRadius: 4
            }]
        },
        options: {
            plugins: {
                annotation: {
                    annotations: buildVerticalLines()
                },
                datalabels: {
                    align: 'top',
                    anchor: 'end',
                    formatter: function(value, ctx) {
                        if (value === null) return "";
                        return ctx.chart.data.labels[ctx.dataIndex] + "\n" + value;
                    },
                    color: 'black',
                    font: {
                        weight: 'bold',
                        size: 10
                    }
                }
            },
            scales: {
                x: {
                    display: false   // REMOVE X-AXIS LABELS ONLY
                }
            }
        }
    });
}

// Create all charts
const sugarChart = createChart("sugarChart", "sugar", "Blood Sugar", "red");
const bpChart = createChart("bpChart", "bp_sys", "BP Systolic", "blue");
const pulseChart = createChart("pulseChart", "pulse", "Pulse", "green");
const spo2Chart = createChart("spo2Chart", "spo2", "SpO₂", "purple");

// ------------------------------------------------------
// Dropdown chart selector
// ------------------------------------------------------

const selector = document.getElementById("chartSelector");
selector.addEventListener("change", function () {
    document.querySelectorAll(".chart-container").forEach(div => div.style.display = "none");
    document.getElementById(selector.value + "Container").style.display = "block";
});

// Show first chart by default
document.getElementById("sugarChartContainer").style.display = "block";

</script>

</body>
</html>
